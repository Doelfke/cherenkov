[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "cherenkov"
version = "0.1.0"
edition = "2024"
default-run = "cherenkov"
description = "Standalone qwen4-exp inference for Apple Silicon"
license = "MIT"

[lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
needless_else = "warn"
redundant_else = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7"
half = "2.7.1"
hf-hub = { version = "1", features = ["blocking"] }
libc = "0.2"
memmap2 = "0.9.11"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
