<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#cfe8ff"/>

  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#8fbf6f"/>
  <rect x="0" y="250" width="400" height="8" fill="#7aa85c"/>

  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="110" cy="210" r="38" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="110" cy="210" r="4" fill="#333"/>
  <line x1="110" y1="210" x2="110" y2="172" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="148" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="110" y2="248" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="72" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="137" y2="183" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="137" y2="237" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="83" y2="237" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="210" x2="83" y2="183" stroke="#333" stroke-width="3"/>

  <!-- Front wheel -->
  <circle cx="290" cy="210" r="38" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="290" cy="210" r="4" fill="#333"/>
  <line x1="290" y1="210" x2="290" y2="172" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="328" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="290" y2="248" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="252" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="317" y2="183" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="317" y2="237" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="263" y2="237" stroke="#333" stroke-width="3"/>
  <line x1="290" y1="210" x2="263" y2="183" stroke="#333" stroke-width="3"/>

  <!-- Frame -->
  <line x1="110" y1="210" x2="175" y2="150" stroke="#d94f30" stroke-width="6"/>
  <line x1="175" y1="150" x2="230" y2="150" stroke="#d94f30" stroke-width="6"/>
  <line x1="230" y1="150" x2="290" y2="210" stroke="#d94f30" stroke-width="6"/>
  <line x1="175" y1="150" x2="175" y2="210" stroke="#d94f30" stroke-width="6"/>
  <line x1="175" y1="210" x2="110" y2="210" stroke="#d94f30" stroke-width="6"/>
  <line x1="175" y1="210" x2="230" y2="150" stroke="#d94f30" stroke-width="6"/>
  <line x1="230" y1="150" x2="250" y2="120" stroke="#d94f30" stroke-width="6"/>
  <line x1="250" y1="120" x2="270" y2="120" stroke="#333" stroke-width="6"/>

  <!-- Seat -->
  <line x1="175" y1="150" x2="165" y2="135" stroke="#333" stroke-width="5"/>
  <ellipse cx="160" cy="132" rx="16" ry="6" fill="#333"/>

  <!-- Pedals -->
  <circle cx="175" cy="210" r="6" fill="#555"/>
  <line x1="175" y1="210" x2="160" y2="225" stroke="#555" stroke-width="4"/>
  <line x1="160" y1="225" x2="150" y2="225" stroke="#333" stroke-width="5"/>

  <!-- Pelican body -->
  <ellipse cx="175" cy="115" rx="42" ry="30" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="2"/>
  <!-- Wing -->
  <ellipse cx="170" cy="112" rx="26" ry="16" fill="#dcdcdc" stroke="#c9c9c9" stroke-width="2"/>

  <!-- Neck -->
  <path d="M 200 100 Q 215 70 235 65" fill="none" stroke="#f5f5f5" stroke-width="16" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="245" cy="62" r="16" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="248" cy="58" r="3" fill="#333"/>

  <!-- Beak -->
  <path d="M 258 60 L 300 66 L 258 72 Q 250 66 258 60 Z" fill="#f0a020" stroke="#d98a10" stroke-width="1.5"/>
  <path d="M 258 72 Q 275 82 300 66" fill="#f0a020" stroke="#d98a10" stroke-width="1.5"/>

  <!-- Legs -->
  <line x1="165" y1="135" x2="160" y2="175" stroke="#f0a020" stroke-width="5"/>
  <line x1="160" y1="175" x2="150" y2="225" stroke="#f0a020" stroke-width="5"/>
</svg>
